*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
}

/* Animated Stars */

.stars{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
overflow:hidden;
z-index:-1;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%,100%{opacity:.3;}
50%{opacity:1;}
}

/* Navbar */

nav{
position:fixed;
top:0;
width:100%;
background:rgba(0,0,0,.3);
backdrop-filter:blur(10px);
display:flex;
justify-content:center;
padding:15px;
z-index:1000;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-weight:600;
transition:.3s;
}

nav a:hover{
color:#38bdf8;
}

padding:20px;
